apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment
  namespace: nginx-gitops
  labels:
    app: nginx

spec:
  replicas: 4

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine

          ports:
            - containerPort: 80
              name: http

          volumeMounts:
            - name: nginx-html
              mountPath: /usr/share/nginx/html
              readOnly: true

      volumes:
        - name: nginx-html
          configMap:
            name: nginx-html

