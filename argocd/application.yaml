apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-gitops
  namespace: argocd

spec:
  project: nginx-project

  source:
    repoURL: https://github.com/Raa9/argocd-nginx-gitops.git
    targetRevision: main
    path: manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gitops

  syncPolicy:
    automated:                   # Enable automated sync
      prune: true                 # Delete resources removed from Git
      selfHeal: true   
    syncOptions:
      - CreateNamespace=true
